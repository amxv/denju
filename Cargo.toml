[workspace]
resolver = "3"
members = [
  "apps/denju",
  "apps/denju-server",
  "crates/denju-core",
  "crates/denju-wire",
  "crates/denju-sync",
  "crates/denju-local",
  "crates/denju-client",
  "crates/denju-registry",
  "crates/denju-testkit",
  "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/amxv/denju"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
