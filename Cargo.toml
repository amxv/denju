[workspace]
resolver = "3"
members = [
  "apps/denju",
  "apps/denju-server",
  "crates/denju-core",
  "crates/denju-wire",
  "crates/denju-sync",
  "crates/denju-local",
  "crates/denju-client",
  "crates/denju-registry",
  "crates/denju-testkit",
  "xtask",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/amxv/denju"

[workspace.dependencies]
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.142.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
argon2 = "0.5.3"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
keyring-core = "1.0.0"
notify = "9.0.0-rc.4"
rand = "0.10"
proptest = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
futures-util = "0.3"
rpassword = "7.5.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
similar = "2"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "json"] }
tempfile = "3"
thiserror = "2"
tar = "0.4.46"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v7"] }
walkdir = "2.5"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
