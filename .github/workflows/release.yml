name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release-like version used only for the non-publishing dry run
        required: true
        default: 0.3.6-dry-run

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cargo xtask check

  binaries:
    needs: quality
    env:
      DENJU_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build native client
        shell: bash
        env:
          DENJU_BUILD_VERSION: ${{ env.DENJU_RELEASE_VERSION }}
        run: |
          export DENJU_BUILD_VERSION="${DENJU_BUILD_VERSION#v}"
          cargo build --release --package denju
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          ACTUAL_VERSION=$("target/release/denju${EXT}" --version)
          test "$ACTUAL_VERSION" = "denju $DENJU_BUILD_VERSION"
          cp "target/release/denju${EXT}" "dist/denju_${{ matrix.os }}_${{ matrix.arch }}${EXT}"
      - uses: actions/upload-artifact@v4
        with:
          name: denju-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  server-image:
    needs: quality
    env:
      DENJU_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION: ${{ env.DENJU_RELEASE_VERSION }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vercel
          platforms: ${{ matrix.platform }}
          build-args: |
            DENJU_BUILD_VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: denju-server:release-smoke
          cache-from: type=gha,scope=denju-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=denju-server-${{ matrix.arch }}
      - name: Verify native server container
        shell: bash
        run: |
          test "$(docker run --rm denju-server:release-smoke --version)" = "denju-server ${{ steps.version.outputs.version }}"
      - name: Smoke-test reference self-host stack
        run: cargo xtask self-host-smoke --image denju-server:release-smoke
      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native server image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vercel
          platforms: ${{ matrix.platform }}
          build-args: |
            DENJU_BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/denju-server:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=denju-server-${{ matrix.arch }}

  distribution-smoke:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-15
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: cargo xtask release-smoke

  assemble:
    needs: [binaries, server-image, distribution-smoke]
    runs-on: ubuntu-24.04
    env:
      DENJU_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: denju-*
          path: dist
          merge-multiple: true
      - name: Generate shared release manifest
        id: version
        shell: bash
        env:
          VERSION: ${{ env.DENJU_RELEASE_VERSION }}
        run: |
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cargo xtask release-manifest --version "$VERSION" --dist dist
          cp install/denju.sh dist/denju.sh
          cp install/denju.ps1 dist/denju.ps1
      - name: Dry-run npm package contents
        working-directory: packages/npm
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm pack --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: denju-release-bundle
          path: dist/*

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [assemble]
    runs-on: ubuntu-24.04
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/denju-server
      DENJU_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: denju-release-bundle
          path: dist
      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION: ${{ env.DENJU_RELEASE_VERSION }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture server manifest
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${{ github.ref_name }}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${{ github.ref_name }}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${{ github.ref_name }}-arm64"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ github.ref_name }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish npm installer
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm publish --access public --ignore-scripts
